# Deployment config for the existing justlikekatie.com apex site.
#
# The authored page remains at the repository root. A small staging step
# publishes only the hand-authored public page and its assets, never the design
# sandbox or project source. This keeps the existing Netlify site and domain.

[build]
  command = "node scripts/prepare-netlify.mjs"
  publish = "generated-artifacts/netlify-site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
