name: Netlify output guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate staged Netlify output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate Netlify output
        run: node scripts/check-netlify-output.mjs
