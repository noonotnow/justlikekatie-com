name: Netlify output guard

on:
  pull_request:
    paths:
      - "index.html"
      - "og-image.png"
      - "images/**"
      - "netlify.toml"
      - "scripts/check-netlify-output.mjs"
      - "scripts/prepare-netlify.mjs"
      - "scripts/netlify-output-validation.mjs"
      - "scripts/netlify-output-validation.test.mjs"
      - ".github/workflows/netlify-output-guard.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate staged Netlify output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate Netlify output
        run: node scripts/check-netlify-output.mjs
